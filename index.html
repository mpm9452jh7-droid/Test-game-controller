<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #0b0b1d;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 8px;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f3ff;
            pointer-events: none;
            display: flex;
            gap: 30px;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #aaa;
            font-size: 13px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>СЧЕТ: <span id="score">0</span></div>
        <div>ЖИЗНИ: <span id="lives">3</span></div>
        <div>ЩИТ: <span id="shieldStatus">ГОТОВ</span></div>
        <div>УЛЬТА: <span id="ultStatus">ГОТОВА</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="instructions">
        🎮 <strong>Геймпад:</strong> Левый стик — Движение | <strong>X (Квадрат/Нижняя)</strong> — Стрельба<br>
        🛡️ <strong>LB / L1</strong> — Щит (неуязвимость на 3 сек) | 💥 <strong>Y / Triangle (Верхняя)</strong> — Ультимативный удар
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let isGameOver = false;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            radius: 20,
            speed: 6,
            color: '#00f3ff',
            shieldActive: false,
            shieldTimer: 0,
            shieldCooldown: 0,
            ultCooldown: 0
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let keys = {};

        // Защита от залипания кнопок геймпада
        let prevButtonStates = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawnEnemy() {
            if (isGameOver) return;
            enemies.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                radius: 18,
                speed: 2 + Math.random() * 3,
                color: '#ff0055'
            });
            setTimeout(spawnEnemy, 900 - Math.min(score * 4, 600));
        }

        let lastShootTime = 0;
        function handleInput() {
            let dx = 0;
            let dy = 0;

            // Клавиатура (движение)
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            // Обработка Геймпада
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp) {
                const deadzone = 0.2;
                let axisX = gp.axes[0]; // Левый стик X
                let axisY = gp.axes[1]; // Левый стик Y

                if (Math.abs(axisX) > deadzone) dx = axisX;
                if (Math.abs(axisY) > deadzone) dy = axisY;

                // Кнопка X (обычно кнопка 0 в стандарте геймпада: Крестик на PS или A на Xbox/Nintendo, либо проверим 2 для Квадрата/X)
                // В стандарте HTML5 Gamepad API: 
                // 0 = A / Cross (нижняя)
                // 2 = X / Square (левая) -> Назначаем её на стрельбу по твоему запросу
                const isShooting = gp.buttons[2].pressed || gp.buttons[0].pressed || gp.buttons[7].pressed;
                if (isShooting) {
                    shoot();
                }

                // Кнопка щита: LB / L1 (обычно кнопка 4)
                const isShieldPressed = gp.buttons[4].pressed;
                if (isShieldPressed && !prevButtonStates[4] && player.shieldCooldown <= 0) {
                    activateShield();
                }
                prevButtonStates[4] = isShieldPressed;

                // Кнопка ульты: Y / Triangle (обычно кнопка 3 вверху)
                const isUltPressed = gp.buttons[3].pressed;
                if (isUltPressed && !prevButtonStates[3] && player.ultCooldown <= 0) {
                    activateUltimate();
                }
                prevButtonStates[3] = isUltPressed;

            } else {
                // Стрельба с клавиатуры (Пробел)
                if (keys['Space']) {
                    shoot();
                }
                // Щит с клавиатуры (Shift)
                if (keys['ShiftLeft'] && player.shieldCooldown <= 0) {
                    activateShield();
                }
                // Ульта с клавиатуры (KeyE)
                if (keys['KeyE'] && player.ultCooldown <= 0) {
                    activateUltimate();
                }
            }

            // Применяем движение (теперь независимо от стрельбы)
            player.x += dx * player.speed;
            player.y += dy * player.speed;

            // Границы экрана
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Кудауны
            if (player.shieldTimer > 0) {
                player.shieldTimer--;
                if (player.shieldTimer <= 0) {
                    player.shieldActive = false;
                }
            }
            if (player.shieldCooldown > 0) player.shieldCooldown--;
            if (player.ultCooldown > 0) player.ultCooldown--;

            updateUI();
        }

        function shoot() {
            const now = Date.now();
            if (now - lastShootTime > 130) {
                bullets.push({ x: player.x, y: player.y - player.radius, speed: 10, radius: 4 });
                lastShootTime = now;
            }
        }

        function activateShield() {
            player.shieldActive = true;
            player.shieldTimer = 180; // 3 секунды при 60 кадрах/сек
            player.shieldCooldown = 300; // 5 секунд кулдаун
            createExplosion(player.x, player.y, '#00f3ff');
        }

        function activateUltimate() {
            player.ultCooldown = 600; // 10 секунд кулдаун
            // Уничтожаем всех врагов на экране и даем очки
            enemies.forEach(enemy => {
                createExplosion(enemy.x, enemy.y, '#ffff00');
                score += 15;
            });
            enemies = [];
            document.getElementById('score').innerText = score;
            
            // Вспышка экрана ульты
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function updateUI() {
            document.getElementById('shieldStatus').innerText = player.shieldActive ? 'АКТИВЕН' : (player.shieldCooldown > 0 ? Math.ceil(player.shieldCooldown / 60) + 'с' : 'ГОТОВ');
            document.getElementById('ultStatus').innerText = player.ultCooldown > 0 ? Math.ceil(player.ultCooldown / 60) + 'с' : 'ГОТОВА';
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color,
                    decay: Math.random() * 0.03 + 0.01
                });
            }
        }

        function update() {
            if (isGameOver) return;

            handleInput();

            // Пули
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Враги
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // Столкновение с игроком
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < player.radius + enemy.radius) {
                    enemies.splice(eIndex, 1);
                    if (player.shieldActive) {
                        createExplosion(enemy.x, enemy.y, '#00f3ff');
                    } else {
                        createExplosion(player.x, player.y, '#ff0055');
                        lives--;
                        document.getElementById('lives').innerText = lives;
                        if (lives <= 0) {
                            isGameOver = true;
                        }
                    }
                }

                // Столкновение с пулей
                bullets.forEach((bullet, bIndex) => {
                    const bDist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (bDist < bullet.radius + enemy.radius) {
                        createExplosion(enemy.x, enemy.y, enemy.color);
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                });

                // Пролет мимо
                if (enemy.y > canvas.height + 30) {
                    enemies.splice(eIndex, 1);
                }
            });

            // Частицы
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Звездный фон
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(canvas.width * 0.2, (Date.now() * 0.05) % canvas.height, 2, 2);
            ctx.fillRect(canvas.width * 0.7, (Date.now() * 0.02) % canvas.height, 1, 1);

            // Щит игрока
            if (player.shieldActive) {
                ctx.save();
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f3ff';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Игрок (неоновый треугольник)
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.strokeStyle = player.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius);
            ctx.lineTo(player.x - player.radius, player.y + player.radius);
            ctx.lineTo(player.x, player.y + player.radius * 0.5);
            ctx.lineTo(player.x + player.radius, player.y + player.radius);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // Пули
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Враги
            enemies.forEach(enemy => {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Частицы
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.restore();
            });

            // Game Over экран
            if (isGameOver) {
                ctx.fillStyle = 'rgba(5, 5, 16, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 48px Segoe UI';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0055';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Segoe UI';
                ctx.fillText('Нажмите F5 для перезапуска', canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setTimeout(spawnEnemy, 1000);
        loop();
    </script>
</body>
</html>
